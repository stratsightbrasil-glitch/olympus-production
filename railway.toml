# ── OLYMPUS v4 — Railway Configuration ─────────────────────────────────────────
#
# ATENÇÃO — MONOREPO COM MÚLTIPLOS SERVIÇOS:
# Este arquivo é lido por TODOS os serviços que apontam para este repositório.
# Por isso, dockerfilePath e healthcheckPath NÃO devem ser definidos aqui —
# cada serviço configura esses campos individualmente no dashboard Railway:
#
#   olympus-api → Settings → Build → Dockerfile Path: Dockerfile.api
#                 Settings → Deploy → Health Check Path: /ping
#
#   olympus-web → Settings → Build → Dockerfile Path: Dockerfile.web
#                 (sem health check — nginx sobe imediatamente)
#
# Apenas configurações seguras para AMBOS os serviços ficam aqui:

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
