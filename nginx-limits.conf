# ── Rate limiting zones (contexto http) ──────────────────────────────────────
# Incluído em /etc/nginx/conf.d/00-limits.conf pelo Dockerfile.web.
# Deve estar fora do bloco server {} (contexto http).

# 30 requisições/minuto por IP para endpoints de API (burst de 10 sem delay)
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;

# Zona mais restrita para auth: 10 req/minuto (proteção extra contra brute-force
# mesmo quando a API já limita internamente por IP)
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
