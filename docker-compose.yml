services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: olympus/postgres:pg15
    container_name: olympus_db
    environment:
      # Defina POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB no .env
      # (ou via variáveis do ambiente do host) antes de subir em produção.
      # Os valores abaixo são apenas defaults para desenvolvimento local.
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-olympus}
    # expose: torna a porta acessível apenas dentro da rede Docker (não ao host).
    # Use `ports: "5432:5432"` APENAS em desenvolvimento local — nunca em produção.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-olympus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: olympus/api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: olympus_api
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - olympus_backups:/app/backups
    environment:
      - NODE_OPTIONS=--max-old-space-size=1024
      - TEST_MODE=${TEST_MODE:-false}
      # Bypass verificação SSL em redes com proxy/inspeção de certificado (desenvolvimento local).
      # Em produção (Railway), não definir NODE_TLS_REJECT_UNAUTHORIZED no .env — Node usa SSL normal.
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-}
      # ── Providers LLM — API keys vêm do env_file (.env); não redefinir aqui
      # para evitar que o shell sem as vars sobrescreva o .env com string vazia.
      # Defaults de modelo e seletor de provider são seguros (não-secretos):
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - GOOGLE_MODEL=${GOOGLE_MODEL:-gemini-2.0-flash}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Seletor de provider ativo (anthropic | google | groq | deepseek | ollama)
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      # A URL é sempre montada com o hostname interno (olympus_db) para que funcione
      # na rede Docker independentemente do DATABASE_URL do .env (que usa localhost).
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@olympus_db:5432/${POSTGRES_DB:-olympus}
      # URL do SearXNG quando rodando no perfil soberano. Vazio = Tavily é usado.
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: olympus/web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: olympus_web
    ports:
      - "80:80"
    depends_on:
      - api
    environment:
      # URL da API usada pelo nginx como proxy reverso.
      # Docker local: nome do serviço interno.
      # Railway/produção: URL pública do serviço API (configurar via variável de ambiente).
      - RAILWAY_API_URL=http://api:3333
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Ollama (opcional — ativar com: docker compose --profile ollama up -d) ────
  ollama:
    image: ollama/ollama:latest
    container_name: olympus_ollama
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 8192M   # 8 GB — suficiente para llama3.1:8b (CPU-only)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── SearXNG — busca soberana self-hosted (Modo SOBERANO) ──────────────────
  # Ativar com: docker compose --profile soberano up -d
  # Garante que intenções de busca não são expostas a provedores SaaS externos.
  # A API interna acessa via SEARXNG_URL=http://searxng:8080 (variável injetada).
  searxng:
    image: searxng/searxng:latest
    container_name: olympus_searxng
    profiles: ["soberano"]
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-olympus-soberano-secret-change-in-prod}
    volumes:
      - searxng_data:/etc/searxng
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  olympus_backups:
  ollama_data:
  searxng_data:
