services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: olympus/postgres:pg15
    container_name: olympus_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olympus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olympus"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: olympus/api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: olympus_api
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - olympus_backups:/app/backups
    environment:
      - NODE_OPTIONS=--max-old-space-size=1024
      - DATABASE_URL=postgresql://postgres:postgres@olympus_db:5432/olympus
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: olympus/web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: olympus_web
    ports:
      - "80:80"
    depends_on:
      - api
    environment:
      # URL da API usada pelo nginx como proxy reverso.
      # Docker local: nome do serviço interno.
      # Railway/produção: URL pública do serviço API (configurar via variável de ambiente).
      - RAILWAY_API_URL=http://api:3333
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Ollama (opcional — ativar com: docker compose --profile ollama up -d) ────
  ollama:
    image: ollama/ollama:latest
    container_name: olympus_ollama
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 8192M   # 8 GB — suficiente para llama3.1:8b (CPU-only)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  olympus_backups:
  ollama_data:
