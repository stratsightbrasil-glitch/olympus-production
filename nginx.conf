server {
    listen 80;
    server_name localhost;

    # Serve os arquivos estáticos do React (Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para a API.
    # RAILWAY_API_URL é substituído por envsubst no startup do container:
    #   - Docker Compose local : http://api:3333
    #   - Railway production   : https://olympus-api-xxxx.up.railway.app
    #
    # Resolvers DNS para re-resolução dinâmica do upstream (necessário quando proxy_pass usa variável):
    #   127.0.0.11 → DNS interno do Docker Compose (resolve nomes de container como "api")
    #   8.8.8.8    → Google DNS — fallback para Railway e outros ambientes sem DNS interno Docker
    # Se o primeiro falhar, nginx tenta o próximo automaticamente.
    resolver 127.0.0.11 8.8.8.8 valid=10s ipv6=off;

    location /api/ {
        # Rate limiting unificado — API já tem rate limit próprio para auth em auth.ts
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        # Variável força nginx a re-resolver via resolver (acima) em vez de cachear o IP.
        # SEM path na variável: com variável, nginx não faz strip do prefixo /api/ automaticamente.
        # Usando proxy_pass $api_upstream (sem /api/), a URI completa /api/v1/... é preservada.
        set $api_upstream RAILWAY_API_URL_PLACEHOLDER;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}