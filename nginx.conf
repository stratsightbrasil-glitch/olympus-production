server {
    listen 80;
    server_name localhost;

    # ── Security headers ────────────────────────────────────────────────────────
    # Aplicados globalmente — tanto para arquivos estáticos quanto para responses
    # da API (via proxy). Duplicar no Hono middleware garante cobertura no Railway.

    # Evita que o browser infira o Content-Type incorreto (MIME sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # Bloqueia embedding em iframes de outras origens (clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Controla quanta info de referrer é enviada em requests cross-origin
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # XSS filter legado desabilitado — navegadores modernos ignoram; pode causar
    # falsos positivos. Proteção real vem do CSP abaixo.
    add_header X-XSS-Protection "0" always;

    # Content Security Policy para SPA React:
    #   default-src 'self'          — bloqueia todos os recursos externos por padrão
    #   script-src 'self' 'unsafe-inline' — Vite/React pode emitir scripts inline
    #   style-src  'self' 'unsafe-inline' — CSS-in-JS e estilos inline
    #   img-src    'self' data: blob:     — data URIs para QR codes, blobs para previews
    #   connect-src 'self'               — AJAX/fetch/SSE só para a própria origem
    #   frame-ancestors 'none'           — reforço do X-Frame-Options
    #   base-uri 'self'                  — evita injeção de <base href>
    #   form-action 'self'               — formulários só para a própria origem
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # HSTS: força HTTPS por 6 meses nos navegadores após o primeiro acesso seguro.
    # Só efetivo em produção (HTTPS). Em localhost (HTTP) é ignorado pelo browser.
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # Serve os arquivos estáticos do React (Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para a API.
    # docker-entrypoint-web.sh escolhe a estratégia correta por ambiente:
    #
    #   Docker Compose local:
    #     RESOLVER_DIRECTIVE_PLACEHOLDER → resolver 127.0.0.11 valid=300s ipv6=off;
    #     PROXY_PASS_DIRECTIVE_PLACEHOLDER → set $upstream "http://api:3333"; proxy_pass $upstream;
    #     Com valid=300s o nginx re-resolve o hostname a cada 5 min em vez de cada request.
    #     Após reinício do Docker Desktop (IPs mudam), auto-heals em ≤ 300s sem intervenção manual.
    #     Os 502s intermitentes anteriores vinham de valid=10s (TTL padrão) — hits de DNS 18× mais
    #     frequentes por perto de timeouts do DNS interno Docker.
    #
    #   Railway production:
    #     RESOLVER_DIRECTIVE_PLACEHOLDER → (vazio)
    #     PROXY_PASS_DIRECTIVE_PLACEHOLDER → proxy_pass <URL estática>;
    #     Domínio Railway nunca muda → proxy_pass estático continua adequado.

    RESOLVER_DIRECTIVE_PLACEHOLDER

    location /api/ {
        # Limite de upload: 50 MB (default nginx = 1 MB → 413 em arquivos maiores).
        client_max_body_size 50M;

        # Rate limiting unificado — API já tem rate limit próprio para auth em auth.ts
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        UPSTREAM_SET_PLACEHOLDER
        proxy_pass PROXY_PASS_URL_PLACEHOLDER;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
