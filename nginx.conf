server {
    listen 80;
    server_name localhost;

    # Serve os arquivos estáticos do React (Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para a API.
    # RAILWAY_API_URL_PLACEHOLDER é substituído por docker-entrypoint-web.sh antes do nginx iniciar:
    #   - Docker Compose local : http://api:3333
    #   - Railway production   : https://olympus-api-xxxx.up.railway.app
    #
    # IMPORTANTE: proxy_pass ESTÁTICO (sem variável $api_upstream).
    # A abordagem anterior com "set $api_upstream; proxy_pass $api_upstream" forçava o nginx
    # a re-resolver o DNS do Docker (127.0.0.11) a cada 10s via resolver directive.
    # O Docker DNS falhava intermitentemente (NXDOMAIN) causando 502 nas requisições SSE.
    # Com proxy_pass estático, o hostname é resolvido UMA VEZ no startup do nginx —
    # confiável porque o container "api" não troca de IP sem um restart explícito.

    location /api/ {
        # Limite de upload: 50 MB (default nginx = 1 MB → 413 em arquivos maiores).
        client_max_body_size 50M;

        # Rate limiting unificado — API já tem rate limit próprio para auth em auth.ts
        limit_req zone=api_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass RAILWAY_API_URL_PLACEHOLDER;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
