server {
    listen 80;
    server_name localhost;

    # Serve os arquivos estáticos do React (Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para a API.
    # RAILWAY_API_URL é substituído por envsubst no startup do container:
    #   - Docker Compose local : http://api:3333
    #   - Railway production   : https://olympus-api-xxxx.up.railway.app
    location /api/ {
        proxy_pass ${RAILWAY_API_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        # SSE — desabilita buffering para streaming funcionar
        proxy_buffering off;
        proxy_cache off;
    }
}