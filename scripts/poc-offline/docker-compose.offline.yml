# ── OLYMPUS v4 — Docker Compose para PoC Offline ─────────────────────────────
# Usa imagens pré-carregadas do pendrive (sem build, sem internet).
# Executar APÓS rodar instalar.ps1 ou docker load manualmente.

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: olympus_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olympus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olympus"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: olympus/api:latest
    container_name: olympus_api
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=--max-old-space-size=1024
      - DATABASE_URL=postgresql://postgres:postgres@olympus_db:5432/olympus
    restart: unless-stopped

  web:
    image: olympus/web:latest
    container_name: olympus_web
    ports:
      - "80:80"
    depends_on:
      - api
    environment:
      - RAILWAY_API_URL=http://api:3333
    restart: unless-stopped

volumes:
  pgdata:
